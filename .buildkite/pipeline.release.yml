agents:
  queue: hosted

steps:
  - block: ":rubygems: OK to release?"

  - label: ":rubygems: Release gem"
    command: ".buildkite/steps/release-gem"
    if: build.tag != null
    plugins:
      - rubygems-oidc#v0.2.0:
          role: "rg_oidc_akr_7wr2dgc1bsmdqawbxowv"
      - docker#v5.12.0:
          image: "ruby:3.4.10"
          environment:
            - GEM_HOST_API_KEY
            - BUILDKITE_TAG
